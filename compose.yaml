services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: inventory
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD:-inventory_dev_password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
      - ./src/public/index.php:/var/www/app/public/index.php:ro
      - ./src/app:/var/www/app/app:ro
      - ./src/templates:/var/www/app/templates:ro
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: ${DB_PASSWORD:-inventory_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1 FROM products LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
